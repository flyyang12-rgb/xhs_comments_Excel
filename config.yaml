# 分析词用于辅助 AI 理解业务口径，不会单独按词机械判定好差评。
analysis_terms:
  negative:
    - "防晒不足"
    - "遮阳范围小"
    - "披肩过短"
    - "帽檐易塌"
    - "遮挡视线"
    - "闷热不透气"
    - "勒脖"
    - "掉色"
    - "开线"
    - "尺码不合"
    - "防风绳脱落"
  positive:
    - "防晒效果好"
    - "遮阳范围大"
    - "披肩够长"
    - "帽檐稳定"
    - "视线不受影响"
    - "透气舒适"
    - "佩戴舒服"
    - "颜色耐看"
    - "做工扎实"
    - "尺码合适"
    - "值得推荐"

throttle:
  search_page_min_seconds: 8
  search_page_max_seconds: 12
  keyword_min_seconds: 20
  keyword_max_seconds: 35
  detail_min_seconds: 6
  detail_max_seconds: 10
  cover_min_seconds: 0.3
  cover_max_seconds: 0.8
  long_rest_every_notes: 80
  long_rest_min_seconds: 180
  long_rest_max_seconds: 300

ai:
  batch_size: 16
  max_retries: 3
  request_timeout_seconds: 120

vision:
  max_concurrency: 3
  max_retries: 3
  request_timeout_seconds: 120
  download_timeout_seconds: 45
